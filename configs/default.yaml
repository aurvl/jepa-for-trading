seed: 42
device: auto

data:
  start: "2005-01-01"
  end: null
  macro_path: "data/raw/macro_data.parquet"
  cache_dir: "data/cache"
  processed_dir: "data/processed"
  lookback: 70
  horizons: [5, 15, 20, 45, 60]
  train_end: "2019-12-31"
  val_end: "2022-12-31"
  tickers:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - JPM
    - BAC
    - XOM
    - CVX
    - UNH
    - JNJ
    - PFE
    - PG
    - KO
    - WMT
    - COST
    - HD
    - CAT
    - BA
    - GE
    - SPY
    - QQQ
    - IWM
    - XLF
    - XLK
    - XLE
    - XLV
    - XLI
    - GLD
    - TLT

model:
  d_model: 128
  latent_dim: 128
  n_heads: 4
  n_layers: 3
  dropout: 0.1
  asset_embedding_dim: 16

training:
  batch_size: 32
  jepa_max_steps: 2000
  heads_max_steps: 1000
  lr: 0.0003
  weight_decay: 0.0001
  ema_decay: 0.996
  checkpoint_dir: "models"
  log_every: 25
  eval_every: 200

portfolio:
  mode: long_only
  cash_initial: 1000.0
  transaction_cost_bps: 5.0
  max_weight_per_asset: 0.15
  max_long_weight: 0.15
  max_short_weight: 0.05
  max_gross_exposure: 1.0
  max_net_exposure: 1.0
  borrow_cost_bps: 2.0
  max_turnover: 0.40
  long_only: true
  derisk_fraction: 0.50

ppo:
  rollout_steps: 252
  total_updates: 50
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  lr: 0.0001
  minibatch_size: 64
  epochs_per_update: 4
  reward_drawdown_penalty: 0.20
  reward_turnover_penalty: 0.05
  reward_concentration_penalty: 0.02

v2:
  world_max_steps: 3000
  world_warmup_steps: 500
  n_action_samples: 4
  planner_action_samples: 128
  planner_top_k: 1
  hidden_dim: 256
  loss_weights:
    jepa: 1.0
    vicreg: 0.05
    outcome: 1.0
    energy: 0.5
    policy: 0.25

v3:
  world_max_steps: 3000
  world_warmup_steps: 500
  n_sampled_actions: 4
  planner_sampled_actions: 96
  no_trade_margin: 0.0
  cash_margin: 0.0
  rank_margin: 0.05
  turnover_energy_penalty: 0.005
  risk_off_drawdown_threshold: -0.20
  risk_on_bootstrap_tolerance: 0.50
  min_risk_on_log_return: -0.25
  loss_weights:
    jepa: 1.0
    vicreg: 0.05
    outcome: 1.0
    energy: 0.5
    policy: 0.25
    rank: 0.5

v4:
  world_max_steps: 3000
  world_warmup_steps: 500
  n_sampled_actions: 8
  planner_sampled_actions: 128
  rank_margin: 0.05
  utility:
    return_weight: 1.0
    drawdown_penalty: 2.5
    volatility_penalty: 0.15
    turnover_penalty: 0.04
    cost_penalty: 2.0
    concentration_penalty: 0.04
    risk_off_drawdown: -0.06
    risk_off_return: -0.03
    defensive_bonus: 0.20
    hold_risk_off_penalty: 0.25
    utility_clip: 3.0
  planner:
    model_score_weight: 0.25
    return_weight: 1.0
    drawdown_penalty: 2.0
    volatility_penalty: 0.12
    turnover_penalty: 0.01
    hard_risk_off_drawdown: -0.06
    hard_risk_off_return: -0.03
    min_action_advantage: 0.005
    cash_bootstrap_min_return: -0.03
    cash_bootstrap_max_drawdown: -0.12
    cash_bootstrap_score_tolerance: 0.15
    rebalance_every: 5
    force_recheck_after: 20
  loss_weights:
    jepa: 1.0
    vicreg: 0.05
    outcome: 1.0
    energy: 0.5
    policy: 0.25
    rank: 0.7

v5:
  world_max_steps: 3000
  world_warmup_steps: 500
  n_sampled_actions: 8
  planner_sampled_actions: 128
  rank_margin: 0.05
  cost:
    annual_return_target: 0.10
    max_drawdown: -0.12
    max_annual_vol: 0.15
    turnover_budget: 0.20
    cost_budget: 0.01
    return_shortfall_weight: 1.0
    drawdown_weight: 2.0
    volatility_weight: 0.4
    turnover_weight: 0.2
    cost_weight: 2.0
    concentration_weight: 0.05
    cost_clip: 3.0
  loss_weights:
    market_jepa: 1.0
    portfolio_jepa: 1.0
    vicreg: 0.05
    outcome: 1.0
    cost: 0.5
    rank: 0.7
